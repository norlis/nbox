        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Retrieve key
      tags:
