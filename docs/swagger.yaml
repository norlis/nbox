            $ref: '#/definitions/problem.Detail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Upsert templates
      tags:
      - templates
  /api/box/{service}/{stage}:
    get:
      description: show metadata & template names
