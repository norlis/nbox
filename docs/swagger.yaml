  nbox_internal_box_store_spec.SpecDefinition:
    properties:
      id:
        description: Unique identifier (e.g., "aws:ecs:task-def-v1")
        type: string
      matchPatterns:
        description: Glob patterns (e.g., "taskdef*.json")
        items:
          type: string
        type: array
      name:
        description: Human-readable name
        type: string
      version:
        description: Schema version
        type: string
    type: object
  nbox_internal_box_store_spec.ValidationError:
    properties:
      message:
        type: string
