        "200":
          description: OK
          schema:
            $ref: '#/definitions/nbox_internal_box_store_spec.ValidationResult'
        "400":
          description: Validation Failed
          schema:
            $ref: '#/definitions/problem.Detail'
      summary: Validate template
      tags:
      - templates
  /api/entry:
    post:
      consumes:
      - application/json
      description: insert / update vars
