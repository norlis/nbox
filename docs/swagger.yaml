  /api/boxspec/reload:
    post:
      description: Hot-reload specs from filesystem without restart
      produces:
      - application/json
      responses:
        "200":
          description: count of loaded specs
          schema:
            additionalProperties:
              type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Reload validation specs
      tags:
      - boxspec
  /api/boxspec/resolve:
    get:
      description: Given a filename pattern, resolves the matching spec and returns
        its JSON Schema representation
      parameters:
      - description: Filename pattern to match (e.g., task-definition.json)
        in: query
        name: pattern
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: JSON Schema
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing pattern parameter
          schema:
            $ref: '#/definitions/problem.Detail'
        "404":
          description: No matching spec found
          schema:
            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Resolve spec and export as JSON Schema
      tags:
      - boxspec
  /api/boxspec/specs:
    get:
      description: Get list of schemas available for template validation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
