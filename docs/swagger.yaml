      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Upsert entries
      tags:
      - entry
  /api/entry/export:
    get:
      description: |-
        Export entries in different formats (JSON, YAML, dotenv, ECS task definition) for backup or migration purposes
        Requires authentication via Bearer token
      parameters:
      - description: 'Prefix to filter entries (required). Example: ''production/'',
          ''staging/myapp/'''
        in: query
        name: prefix
        required: true
        type: string
      - default: json
        description: Output format
        enum:
        - json
        - yaml
        - dotenv
        - ecs
        in: query
        name: format
        type: string
      produces:
      - application/json
      - application/x-yaml
      - text/plain
      responses:
        "200":
          description: Exported file with entries
          headers:
            Content-Disposition:
              description: attachment; filename=nbox-export-{prefix}-{timestamp}.{ext}
              type: string
            X-Export-Count:
              description: Number of entries exported
              type: string
            X-Export-Size:
              description: Size in bytes of exported file
              type: string
          schema:
            type: file
        "400":
          description: Invalid parameters (missing prefix or invalid format)
          schema:
            $ref: '#/definitions/problem.Detail'
        "401":
          description: Unauthorized - Missing or invalid token
          schema:
            $ref: '#/definitions/problem.Detail'
        "403":
          description: Forbidden - Insufficient permissions
          schema:
            $ref: '#/definitions/problem.Detail'
        "404":
          description: No entries found with specified prefix
          schema:
            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Export configuration entries
      tags:
      - export
