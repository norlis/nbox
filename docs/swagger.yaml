      tags:
      - auth
  /api/box:
    get:
      consumes:
      - application/json
      description: all templates
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_box.Box'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Detail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: List templates
      tags:
      - templates
    post:
      consumes:
      - application/json
      description: insert or update templates on s3
      parameters:
      - description: Upsert template
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/internal_box.Command-internal_box_Box'
