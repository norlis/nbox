            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Delete
      tags:
      - entry
    get:
      description: detail
      parameters:
      - description: key path
        in: query
        name: v
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
