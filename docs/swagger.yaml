      description: authentication token
      parameters:
      - description: Payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/internal_auth.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token generated successfully
