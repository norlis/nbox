      - application/json
      description: Check the existence of the template
      parameters:
      - description: service name
        in: path
        name: service
        required: true
        type: string
      - description: stage
        in: path
        name: stage
        required: true
        type: string
      - description: template name
        in: path
        name: template
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              exist:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Exist template
      tags:
      - templates
    post:
      consumes:
      - application/json
      description: insert or update a specific template on s3
      parameters:
      - description: service name
        in: path
        name: service
        required: true
        type: string
      - description: stage name
        in: path
        name: stage
        required: true
        type: string
      - description: template name
        in: path
        name: template
        required: true
        type: string
      - description: Template content (Base64 encoded)
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/internal_box.Input'
      produces:
      - application/json
      responses:
        "200":
          description: List of updated paths
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Detail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Detail'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/problem.Detail'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Upsert template
      tags:
      - templates
  /api/box/{service}/{stage}/{template}/build:
    get:
      description: replace vars patterns
      parameters:
      - description: service name
        in: path
