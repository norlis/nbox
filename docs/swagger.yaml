        description: e.g., "containerDefinitions.0.memory"
        type: string
    type: object
  nbox_internal_box_store_spec.ValidationResult:
    properties:
      errors:
        items:
          $ref: '#/definitions/nbox_internal_box_store_spec.ValidationError'
        type: array
